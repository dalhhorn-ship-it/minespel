name: Deploy to Cloudflare Workers
# Spare manual path. The normal deploy is Cloudflare Workers Builds on every merge to main (decision 98).
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Does not rerun the tests: it deploys only a commit whose CI run is green.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CI is green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$green" = "0" ]; then
            echo "No green CI run for $GITHUB_SHA. Wait for CI to pass (or run it by hand), then deploy again." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: PRD signoff matches
        run: ./scripts/signoff.sh --check
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build && npm run test:dist
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
