name: CI
# Runs once per commit. Pushes to any branch run it. A pull request from a branch in this repo
# already gets the push run's checks, so pull_request runs only for forks.
# A newer push to the same branch cancels the older run. Runs on main are never cancelled.
# Content release path: a change with only learning modules or docs skips e2e
# (scripts/check-scope.sh). main always runs everything.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ui_review:
        description: Also run the full UI review (ui-review.spec.ts). Every 5 releases or so, or after a lot of UI change (decision 106).
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CHECK_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
  CHECK_FULL: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
  UI_REVIEW: ${{ inputs.ui_review && '1' || '0' }}
jobs:
  check:
    name: lint, types, unit, build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: PRD signoff matches
        run: |
          if [ -d src ] || [ -f package.json ]; then ./scripts/signoff.sh --check; fi
      - name: Check without e2e
        run: CHECK_E2E=0 ./scripts/check.sh

  e2e:
    name: e2e ${{ matrix.shard }}/4
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # The Playwright image already holds WebKit and its system libraries, so nothing is downloaded.
    # Keep the tag equal to the installed @playwright/test version (package-lock.json).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope
        id: scope
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$CHECK_FULL" = "1" ] || [ "$UI_REVIEW" = "1" ]; then scope=full; else scope=$(./scripts/check-scope.sh); fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Check scope: $scope"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.scope == 'full'
        with:
          node-version: 22
          cache: npm
      - if: steps.scope.outputs.scope == 'full'
        run: npm ci --no-audit --no-fund
      - name: WebKit e2e, shard ${{ matrix.shard }} of 4
        if: steps.scope.outputs.scope == 'full'
        run: npx playwright test --shard=${{ matrix.shard }}/4
