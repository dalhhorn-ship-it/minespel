name: Deploy to Cloudflare Workers
# Manual only: every deploy is a founder decision.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PRD signoff matches
        run: ./scripts/signoff.sh --check
      - name: Install dependencies and Playwright WebKit
        run: npm install --no-audit --no-fund && npx playwright install --with-deps webkit
      - name: Check
        env:
          CHECK_FULL: '1'
        run: ./scripts/check.sh
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
